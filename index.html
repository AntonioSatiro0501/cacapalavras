<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      background-color: #050505;
    }

    .fase { display: none; }
    .fase.ativa { display: block; }
  </style>
</head>
<body>

  <div id="app"></div>

  <script>
    let estadoAtual = 1;

    function checarRespostaEstado1(reposta) {
      const resposta = reposta.trim().toLowerCase();
      if (resposta == "uwaw" ) {
        avancar();
      }
    }

    const estados = {
      1: {
        render: () => `
          <input id = uwaw type="text"/>
          <button onclick="checarRespostaEstado1(document.getElementById('uwaw').value)">?</button>
          <img src="cacapalavras.png" alt="Caça-palavras" style="display: block; margin: auto; opacity: 0.1;">
        `
      },
      2: {
        render: () => ``
      },
      3: {
        render: () => ``
      }
    };

    function avancar() {
      estadoAtual++;
      renderizar();
    }

    function renderizar() {
      document.getElementById('app').innerHTML = estados[estadoAtual].render();
    }

    function main() {
      renderizar(); 
    }

    main();
  </script>

</body>
</html>
