<!DOCTYPE html>
<html>
<head>
  <style>
    .fase { display: none; }
    .fase.ativa { display: block; }
  </style>
</head>
<body>

  <div id="app"></div>

  <script>
    // ===== "ESTADO GLOBAL" =====
    let estadoAtual = 1;

    // ===== DADOS DE CADA FASE (separado da lógica) =====
    const fases = {
      1: {
        render: () => `</p><button onclick="avancar()">Próxima</button>`
      },
      2: {
        render: () => `</p><button onclick="avancar()">Próxima</button>`
      },
      3: {
        render: () => ``
      }
    };

    // ===== FUNÇÕES DE TRANSIÇÃO =====
    function avancar() {
      estadoAtual++;
      renderizar();
    }

    function renderizar() {
      document.getElementById('app').innerHTML = fases[estadoAtual].render();
    }

    // ===== "MAIN" — o ponto de entrada, chamado explicitamente =====
    function main() {
      renderizar(); // desenha a fase 1 ao carregar
    }

    main(); // chamada no fim do script, funciona como seu "main()"
  </script>

</body>
</html>
