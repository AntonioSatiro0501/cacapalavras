<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      background-color: #050505;
    }

    img {
      max-width: 100%;
    }

    .fase { display: none; }
    .fase.ativa { display: block; }
  </style>
</head>
<body>

  <div id="app"></div>

  <script>
    let estadoAtual = 1;
    let subEstadoAtual = 0;

    const subEstados = [
      { resposta: 'cometa', imagem: 'cacapalavras.png', },
      { resposta: 'cosmos', imagem: 'cacapalavras.png' },
      { resposta: 'escura', imagem: 'cacapalavras.png' },
      { resposta: 'cadente', imagem: 'cacapalavras.png' },
      { resposta: 'nebulosa', imagem: 'cacapalavras.png' },
      { resposta: 'supernova', imagem: 'cacapalavras.png' },
      { resposta: 'tempo', imagem: 'cacapalavras.png' },
      { resposta: 'eclipse', imagem: 'cacapalavras.png' },
      { resposta: 'natural', imagem: 'cacapalavras.png' }
    ];

    function checarResposta(resposta, tentativa) {
      const tentativaFiltrada = tentativa.trim().toLowerCase();
      if (resposta === tentativaFiltrada) {
        avancar();  
      }
    }

    function checarSubResposta(tentativa) {
      const respostaAtual = subEstados[subEstadoAtual].resposta;
      const tentativaFiltrada = tentativa.trim().toLowerCase();

      if (respostaAtual !== tentativaFiltrada) {
        return;
      }

      if (subEstadoAtual === subEstados.length - 1) {
        avancar();
        return;
      }

      subEstadoAtual++;
      renderizar();
    }

    const estados = {
      1: {
        render: () => `
          <input id = tentativa type="text"/>
          <button onclick="checarResposta('uwaw', document.getElementById('tentativa').value)">?</button>
          <img src="cacapalavras.png" alt="Caça-palavras" style="display: block; margin: auto; opacity: 0.1;">
        `
      },
      2: {
        render: () => 
          `<input id = tentativa type="text" placeholder="23/08/2026"/>
          <button onclick="checarResposta('espiral', document.getElementById('tentativa').value)">?</button>
          <audio controls style="display: block; margin: 24px auto 12px;">
            <source src="correnteoceanica.mp3" type="audio/mpeg">
          </audio>
          <a href="correnteoceanica.mp3" download="correnteoceanica.mp3" aria-label="Baixar áudio" style="display: block; width: max-content; margin: auto; padding: 8px 12px; color: white; background: #242424; text-decoration: none; border-radius: 6px;">
            <span role="img" aria-label="Caveira">💀</span>
          </a>`
      },
      3: {
        render: () =>
          `
            <img src="${subEstados[subEstadoAtual].imagem}" alt="Imagem do subestado ${subEstadoAtual + 1}">
            <input id="tentativaSubEstado" type="text" placeholder="${subEstados[subEstadoAtual].resposta.length} letras"/>
            <button onclick="checarSubResposta(document.getElementById('tentativaSubEstado').value)">
              Confirmar
            </button>
          `
      },
      4: {
        render: () => ``
      }
    };

    function avancar() {
      estadoAtual++;
      renderizar();
    }

    function renderizar() {
      document.getElementById('app').innerHTML = estados[estadoAtual].render();
    }

    function main() {
      renderizar(); 
    }

    main();
  </script>

</body>
</html>
